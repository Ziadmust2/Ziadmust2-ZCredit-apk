name: Build APK

# This one file creates the whole Android project and builds the APK.
# Run it from the Actions tab: Build APK > Run workflow.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'ZEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZCredit"
          include ':app'
          ZEOF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'ZEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ZEOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'ZEOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          ZEOF
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'ZEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zcredit.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.zcredit.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ZEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="ZCredit"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/java/com/zcredit/app/MainActivity.java')"
          cat > 'app/src/main/java/com/zcredit/app/MainActivity.java' <<'ZEOF'
          package com.zcredit.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final String HOME_URL = "https://zcredit.wasmer.app/";
              private static final String HOME_HOST = "zcredit.wasmer.app";

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);          // the site keeps the login and theme in browser storage
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  // No pinch zoom and no zoom buttons in the bottom-right corner.
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  CookieManager.getInstance().setAcceptCookie(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (HOME_HOST.equals(uri.getHost())) {
                              return false;                       // stay inside the app
                          }
                          startActivity(new Intent(Intent.ACTION_VIEW, uri));   // anything else opens in the browser
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(HOME_URL);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          cat > 'app/src/main/res/values/colors.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_bg">#F5F7FA</color>
              <color name="app_bar">#FFFFFF</color>
          </resources>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bar</item>
                  <item name="android:navigationBarColor">@color/app_bar</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/values-night/colors.xml')"
          cat > 'app/src/main/res/values-night/colors.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_bg">#0E1217</color>
              <color name="app_bar">#151A21</color>
          </resources>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/values-night/themes.xml')"
          cat > 'app/src/main/res/values-night/themes.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bar</item>
                  <item name="android:navigationBarColor">@color/app_bar</item>
              </style>
          </resources>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/values-v27/themes.xml')"
          cat > 'app/src/main/res/values-v27/themes.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bar</item>
                  <item name="android:navigationBarColor">@color/app_bar</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_background.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher_background.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:type="linear"
                  android:angle="315"
                  android:startColor="#1B2431"
                  android:endColor="#0D1318" />
          </shape>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_foreground.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher_foreground.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- The 512px ZCredit icon drawn at 57% of the adaptive canvas so the whole icon stays visible under any launcher shape -->
              <group
                  android:translateX="23.22"
                  android:translateY="23.22"
                  android:scaleX="0.12023"
                  android:scaleY="0.12023">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M120,104 L360,104 L360,172 L191,308 L360,308 L360,376 L120,376 L120,308 L289,172 L120,172 Z" />
                  <path
                      android:fillColor="#2F8F5B"
                      android:pathData="M398,384 H466 A14,14 0 0 1 480,398 V442 A14,14 0 0 1 466,456 H398 A14,14 0 0 1 384,442 V398 A14,14 0 0 1 398,384 Z" />
                  <path android:fillColor="#215F3D" android:pathData="M430,384 H435 V456 H430 Z" />
                  <path android:fillColor="#215F3D" android:pathData="M384,406 H480 V411 H384 Z" />
                  <path android:fillColor="#215F3D" android:pathData="M384,430 H480 V435 H384 Z" />
              </group>
          </vector>
          ZEOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zcredit-apk
          path: app/build/outputs/apk/debug/app-debug.apk
